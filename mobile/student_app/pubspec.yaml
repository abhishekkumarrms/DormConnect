name: student_app
description: DormConnect Student App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  dormconnect_core:
    path: ../packages/dormconnect_core
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  firebase_core: ^2.27.0
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
